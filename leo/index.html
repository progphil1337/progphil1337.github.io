<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap');

    /**
    Dunkelgrün		1F4D2D
    Dunkelbeige		D6C6A5
    Off-White		EFE6D6
    Off-Black		161616

    (Filler-Olive		7B8A69)
    (Filler-Hellgrün	3A7A3A)
     */
    :root {
      --dark-beige: #D6C6A5;
      --off-white: #EFE6D6;
      --off-black: #161616;
      --filler-olive: #7B8A69;
      --filler-light-green: #3A7A3A;
      --dark-green: #1F4D2D;

      --light-creme: #EFE6D6;
      --textured-greige: #D6C6A5;
      --dark-brown: #2D231E;
      --header: #3A7A3A;
      --footer: #1F4D2D;
      --terracotta: #C0785C;
    }

    body, html {
      padding: 0;
      font-family: 'Noto Serif', serif;
      margin: 0;
      background-color: var(--light-creme);
    }

    body {
      margin-top: 325px;
    }

    .grid-layout {
      margin: 0 auto;
      padding: 0;
      min-height: 100dvh;
      display: grid;

      grid-template-rows: auto auto 1fr auto auto;

      grid-template-areas:
        "header"
        "sidebar"
        "content"
        "contact"
        "footer";
    }

    .header  { grid-area: header; }
    .sidebar { grid-area: sidebar; }
    .content { grid-area: content; }
    .contact   { grid-area: contact; margin-top: -1rem }
    .footer  { grid-area: footer; }

    @media (min-width: 1020px) {
      .grid-layout {
        grid-template-columns: 350px 1fr;
        grid-template-rows: auto max-content 1fr auto;
        grid-template-areas:
          "header  header"
          "sidebar content"
          "contact content"
          "footer  footer";
      }
    }

    .grid-layout > * {
      padding: 1rem 2rem;
      background-color: var(--light-creme);
      text-align: left;
      font-weight: bold;
    }

    .header, .footer {
      color: white;
    }

    .header {
      left: 0;
      top: 0;
      position: fixed;
      overflow: hidden;
      background-color: var(--header);
      isolation: isolate;
      width: 100%;
      height: 300px;
      z-index: 100;

      padding: 1rem 0;
      box-sizing: border-box;

      /* Modern centering for the logo */
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 10px 3px rgba(0,0,0, 0.8);
    }

    .header::before {
      content: "";
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      background-image:
              linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
              url("https://permaculture-design.earth/wp-content/uploads/2024/12/IMG_5969.jpg");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      filter: blur(3px);
      z-index: -1;
    }

    .header > * {
      position: relative;
      z-index: 1;
    }

    .header > #logo {
      height: 100%;
      max-height: 300px;
      min-height: 50px;
      width: auto;
      position: relative;
      z-index: 1;
      transition: height 0.1s ease-out;
    }

    .footer {
      background-color: var(--footer);
      min-height: 25px;
    }

    .content {
      display: grid;
      gap: 15px;
    }

    .content-row {
      background-color: var(--textured-greige);
      padding: 1.5rem;
      border-radius: 3px;
    }

    h1, h2, h3, h4 {
      color: var(--dark-brown);
      text-align: left;
    }

    hr {
      display: block;
      margin: 25px 0;
      border: none;
      border-top: 1px solid var(--dark-brown); /* Applies your custom brown */
      box-shadow: none;
    }

    .logo {
      fill: var(--off-white);
     }

    nav > ul {
      padding: 0;
      list-style: none;
      margin: 0 0 0 -10px;
    }

    nav > ul > li {
      color: var(--dark-brown);
      padding: 10px;
      margin: 1px 0;
      font-size: 1.5em;
      cursor: pointer;
      border-radius: 6px;
    }

    nav > ul > li.selected {
      background-color: var(--dark-brown);
      color: var(--light-creme);
      cursor: default;
    }

    nav > ul > li:not(.selected):hover {
      background-color: var(--textured-greige);
    }

    a[href] {
      color: inherit;
      text-decoration: none;
    }

    a[href]:hover {
      text-decoration: underline;
    }
  </style>
</head>
